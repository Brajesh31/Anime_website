<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">Playback request flow</title><desc id="desc">The player route requests playback metadata, checks the response and source list, and either renders ReactPlayer or presents an unavailable/error state.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#3a1838"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#a5b4fc"/></marker></defs>
<rect width="1000" height="480" rx="24" fill="url(#bg)"/><text x="50" y="65" fill="#fff" font-family="Arial" font-size="31" font-weight="700">▶ Playback request flow</text>
<g font-family="Arial" text-anchor="middle"><rect x="60" y="175" width="180" height="100" rx="16" fill="#263b59" stroke="#7dd3fc" stroke-width="2"/><text x="150" y="215" fill="#fff" font-size="20" font-weight="700">Player route</text><text x="150" y="245" fill="#cbd5e1" font-size="15">Read episode ID</text>
<rect x="330" y="175" width="190" height="100" rx="16" fill="#263b59" stroke="#a5b4fc" stroke-width="2"/><text x="425" y="215" fill="#fff" font-size="20" font-weight="700">Request metadata</text><text x="425" y="245" fill="#cbd5e1" font-size="15">External provider</text>
<polygon points="680,160 770,225 680,290 590,225" fill="#4b315e" stroke="#d8b4fe" stroke-width="2"/><text x="680" y="220" fill="#fff" font-size="18" font-weight="700">Valid</text><text x="680" y="242" fill="#fff" font-size="18" font-weight="700">source?</text>
<rect x="830" y="110" width="140" height="90" rx="16" fill="#164e45" stroke="#5eead4" stroke-width="2"/><text x="900" y="145" fill="#fff" font-size="18" font-weight="700">ReactPlayer</text><text x="900" y="173" fill="#ccfbf1" font-size="14">Play source</text>
<rect x="830" y="280" width="140" height="90" rx="16" fill="#4c2630" stroke="#fda4af" stroke-width="2"/><text x="900" y="315" fill="#fff" font-size="18" font-weight="700">Unavailable</text><text x="900" y="343" fill="#ffe4e6" font-size="14">Explain / retry</text></g>
<g fill="none" stroke="#a5b4fc" stroke-width="3" marker-end="url(#a)"><path d="M240 225H325"/><path d="M520 225H585"/><path d="M770 205L825 165"/><path d="M770 245L825 325"/></g>
<text x="800" y="135" fill="#5eead4" font-family="Arial" font-size="14">YES</text><text x="800" y="275" fill="#fda4af" font-family="Arial" font-size="14">NO / ERROR</text>
<text x="55" y="430" fill="#94a3b8" font-family="Arial" font-size="14">Target behavior diagram. Current player code still needs stronger response validation and failure-state handling.</text>
</svg>