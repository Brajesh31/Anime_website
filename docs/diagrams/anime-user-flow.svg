<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Anime discovery user flow</title><desc id="desc">Reader opens anime catalog, submits a search, views provider results, selects a title, loads details, chooses an episode, and opens the player.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#31204b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#c4b5fd"/></marker></defs>
<rect width="1200" height="500" rx="26" fill="url(#bg)"/><text x="55" y="65" fill="#fff" font-family="Arial" font-size="32" font-weight="700">🔎 Anime discovery · User journey</text>
<g font-family="Arial" text-anchor="middle"><g fill="#263b59" stroke="#7dd3fc" stroke-width="2">
<rect x="55" y="180" width="150" height="110" rx="16"/><rect x="255" y="180" width="150" height="110" rx="16"/><rect x="455" y="180" width="150" height="110" rx="16"/><rect x="655" y="180" width="150" height="110" rx="16"/><rect x="855" y="180" width="150" height="110" rx="16"/><rect x="1055" y="180" width="100" height="110" rx="16"/></g>
<g fill="#fff" font-size="20" font-weight="700"><text x="130" y="225">Open</text><text x="130" y="252">/anime</text><text x="330" y="225">Enter</text><text x="330" y="252">query</text><text x="530" y="225">Provider</text><text x="530" y="252">results</text><text x="730" y="225">Select</text><text x="730" y="252">title</text><text x="930" y="225">Details +</text><text x="930" y="252">episodes</text><text x="1105" y="225">Play</text><text x="1105" y="252">episode</text></g>
<g fill="none" stroke="#c4b5fd" stroke-width="3" marker-end="url(#a)"><path d="M205 235H250"/><path d="M405 235H450"/><path d="M605 235H650"/><path d="M805 235H850"/><path d="M1005 235H1050"/></g>
<text x="600" y="370" fill="#cbd5e1" font-size="17">Remote provider responses control whether results and playback can be displayed.</text>
<text x="600" y="405" fill="#fda4af" font-size="16">Failure, empty-result, and unavailable states need clear user-facing handling.</text></g>
</svg>