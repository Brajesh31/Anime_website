<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Anime Website system architecture</title>
<desc id="desc">Browser loads the Vite React application, React Router selects page components, and pages request data from external anime and manga services. Player components use a remote media source.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#24133b"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263b59"/><stop offset="1" stop-color="#3a2855"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#a5b4fc"/></marker></defs>
<rect width="1200" height="680" rx="28" fill="url(#bg)"/>
<text x="60" y="72" fill="#fff" font-family="Inter,Arial" font-size="34" font-weight="700">🌸 Anime Website · System architecture</text>
<text x="60" y="108" fill="#b9c6dc" font-family="Inter,Arial" font-size="17">Current browser-side prototype and its external service boundaries</text>
<g font-family="Inter,Arial" text-anchor="middle">
<rect x="60" y="220" width="190" height="130" rx="18" fill="url(#card)" stroke="#7dd3fc" stroke-width="2"/><text x="155" y="270" fill="#fff" font-size="23" font-weight="700">Browser</text><text x="155" y="304" fill="#cbd5e1" font-size="16">index.html</text><text x="155" y="328" fill="#cbd5e1" font-size="16">React mount</text>
<rect x="330" y="220" width="210" height="130" rx="18" fill="url(#card)" stroke="#a5b4fc" stroke-width="2"/><text x="435" y="270" fill="#fff" font-size="23" font-weight="700">React App</text><text x="435" y="304" fill="#cbd5e1" font-size="16">main.jsx · App.jsx</text><text x="435" y="328" fill="#cbd5e1" font-size="16">React Router</text>
<rect x="620" y="130" width="230" height="130" rx="18" fill="url(#card)" stroke="#c4b5fd" stroke-width="2"/><text x="735" y="180" fill="#fff" font-size="22" font-weight="700">Anime pages</text><text x="735" y="214" fill="#cbd5e1" font-size="16">Search · details</text><text x="735" y="238" fill="#cbd5e1" font-size="16">Recent episodes</text>
<rect x="620" y="340" width="230" height="130" rx="18" fill="url(#card)" stroke="#f0abfc" stroke-width="2"/><text x="735" y="390" fill="#fff" font-size="22" font-weight="700">Manga / novels</text><text x="735" y="424" fill="#cbd5e1" font-size="16">Manga experiments</text><text x="735" y="448" fill="#cbd5e1" font-size="16">Novel placeholder</text>
<rect x="930" y="130" width="220" height="130" rx="18" fill="#153b42" stroke="#5eead4" stroke-width="2"/><text x="1040" y="180" fill="#fff" font-size="22" font-weight="700">Anime API</text><text x="1040" y="214" fill="#ccfbf1" font-size="16">Metadata / episodes</text><text x="1040" y="238" fill="#ccfbf1" font-size="16">Third-party service</text>
<rect x="930" y="340" width="220" height="130" rx="18" fill="#49301a" stroke="#fbbf24" stroke-width="2"/><text x="1040" y="390" fill="#fff" font-size="22" font-weight="700">Manga API</text><text x="1040" y="424" fill="#fef3c7" font-size="16">Proxy / catalog data</text><text x="1040" y="448" fill="#fef3c7" font-size="16">Third-party service</text>
<rect x="620" y="535" width="530" height="90" rx="18" fill="#3f1d32" stroke="#fb7185" stroke-width="2"/><text x="885" y="575" fill="#fff" font-size="21" font-weight="700">Remote media host · ReactPlayer</text><text x="885" y="602" fill="#fecdd3" font-size="16">Playback availability and rights are external dependencies</text>
</g>
<g fill="none" stroke="#a5b4fc" stroke-width="3" marker-end="url(#arrow)"><path d="M250 285 H325"/><path d="M540 260 L615 205"/><path d="M540 310 L615 400"/><path d="M850 195 H925"/><path d="M850 405 H925"/><path d="M735 470 V530"/></g>
<text x="60" y="645" fill="#94a3b8" font-family="Inter,Arial" font-size="14">Conceptual system map. It does not imply that external APIs or media are owned by this repository.</text>
</svg>